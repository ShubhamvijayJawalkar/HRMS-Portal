services:
  - type: web
    name: hrms-portal
    runtime: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: sh -c 'alembic -c migrations/alembic.ini upgrade head && gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120'
    envVars:
      - key: APP_DB
        value: postgres
      - key: APP_DB_SCHEMA
        value: public
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: FLASK_DEBUG
        value: "0"
      - key: FLASK_ENV
        value: "production"
      - key: DB_FILE
        value: /data/hrms.duckdb
      - key: SECRET_KEY
        generateValue: true
      - key: LOG_LEVEL
        value: "WARNING"
      - key: PYTHON_VERSION
        value: "3.12"
    healthCheckPath: /login
    autoDeploy: true
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
