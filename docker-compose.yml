services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hrms}
      POSTGRES_USER: ${POSTGRES_USER:-hrms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - hrms-postgres:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hrms} -d ${POSTGRES_DB:-hrms}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    volumes:
      - hrms-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - hrms-minio:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Expand/contract migrations run once before the web process starts.
  migrate:
    build:
      context: .
      target: production
    command: ["alembic", "-c", "migrations/alembic.ini", "upgrade", "head"]
    environment:
      APP_DB: postgres
      APP_DB_SCHEMA: public
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hrms}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-hrms}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      FLASK_ENV: production
      FLASK_DEBUG: "0"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  hrms:
    build:
      context: .
      target: production
    ports:
      - "5000:10000"
    volumes:
      - hrms-data:/data
      - hrms-uploads:/app/uploads
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      FLASK_DEBUG: "0"
      FLASK_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-WARNING}
      HRMS_ALLOW_DEMO_SEED: ${HRMS_ALLOW_DEMO_SEED:-0}
      APP_DB: postgres
      APP_DB_SCHEMA: public
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hrms}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-hrms}
      REDIS_URL: redis://redis:6379/0
      # Required only to anonymise an employee (FR-USR); without it the
      # anonymisation routes refuse to run rather than use a weak mapping.
      ANONYMISATION_SALT: ${ANONYMISATION_SALT:-}
      # Encrypts authenticator secrets at rest (FR-AUTH-11); MFA returns 503 without it.
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
      # FR-JOB-05 scheduler lease TTL. The leader renews at a third of this and shuts
      # its scheduler down if the lease is lost, so this bounds how long a crashed
      # leader's jobs go unowned.
      SCHEDULER_LEASE_TTL: ${SCHEDULER_LEASE_TTL:-60}
      # Outbound mail. Password resets, welcome tokens and payroll notifications
      # are all delivered through the outbox, so an unset SMTP_HOST now makes those
      # events retry and dead-letter rather than falsely report delivered. Verify a
      # real provider with `python scripts/check_smtp.py --to <an address you control>`.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@hrms.com}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-15}
      # Object storage (MinIO for FR-PAY-07 payslips, FR-DOC-02 documents)
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-hrms}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_PRESIGNED_EXPIRY: ${S3_PRESIGNED_EXPIRY:-3600}
      # Rate limits (SRS §10 / FR-AUTH-01). Per-employee once authenticated,
      # per-address while anonymous; 200/min is the shift-start burst target.
      DEFAULT_RATE_LIMIT: ${DEFAULT_RATE_LIMIT:-600 per minute}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-200 per minute}
      # Password-reset route limits. The SRS says 5/min; overridable because a hardcoded
      # literal is a deployment knob nobody can turn.
      FORGOT_PASSWORD_RATE_LIMIT: ${FORGOT_PASSWORD_RATE_LIMIT:-5 per minute}
      RESET_PASSWORD_RATE_LIMIT: ${RESET_PASSWORD_RATE_LIMIT:-5 per minute}
      PORT: 10000
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10000/login"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  hrms-postgres:
  hrms-redis:
  hrms-minio:
  hrms-data:
  hrms-uploads:
