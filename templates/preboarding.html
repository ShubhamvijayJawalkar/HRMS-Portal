<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HRMS - Pre-boarding</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f1f5f9; }
        .card { border: 0; border-radius: 14px; box-shadow: 0 2px 12px rgba(15,23,42,.08); }
        .status { font-size: .8rem; font-weight: 700; }
        .status-Pending { color: #92400e; }
        .status-Uploaded { color: #1d4ed8; }
        .status-Approved { color: #166534; }
    </style>
</head>
<body>
<main class="container py-5" style="max-width: 760px;">
    <div class="card mb-4">
        <div class="card-body p-4">
            <h1 class="h3 mb-2">Welcome, {{ workflow.employee }}</h1>
            <p class="text-secondary mb-0">Your offer was accepted. Upload the required documents to begin pre-boarding.</p>
            <div class="mt-3 small text-secondary">Current step: {{ workflow.current_step }} of 5 · Link expires in 14 days</div>
        </div>
    </div>
    <div class="card">
        <div class="card-body p-4">
            <h2 class="h5 mb-3">Required documents</h2>
            <div class="list-group" id="documents">
                {% for item in workflow.checklist %}
                <div class="list-group-item d-flex align-items-center justify-content-between gap-3">
                    <div><strong>{{ item.doc_type }}</strong><div class="small text-secondary status-{{ item.status }}">{{ item.status }}</div></div>
                    <input type="file" id="file-{{ item.id }}" class="form-control form-control-sm" style="max-width: 230px;">
                    <button class="btn btn-sm btn-outline-primary" onclick="upload({{ item.id }}, '{{ item.doc_type }}')">Upload</button>
                </div>
                {% endfor %}
            </div>
            <div id="message" class="mt-3 small"></div>
            <button class="btn btn-primary mt-3" onclick="submitPreboarding()">Submit pre-boarding</button>
        </div>
    </div>
</main>
<script>
const token = {{ token | tojson }};
async function upload(itemId, docType) {
    const input = document.getElementById(`file-${itemId}`);
    if (!input.files.length) { document.getElementById('message').textContent = 'Choose a file first.'; return; }
    const body = new FormData(); body.append('file', input.files[0]);
    const response = await fetch(`/api/preboarding/${token}/documents/${encodeURIComponent(docType)}`, {method: 'POST', body});
    const result = await response.json();
    document.getElementById('message').textContent = result.error || result.message;
    if (response.ok) location.reload();
}
async function submitPreboarding() {
    const response = await fetch(`/api/preboarding/${token}/submit`, {method: 'POST'});
    const result = await response.json();
    document.getElementById('message').textContent = result.error || result.message;
    if (response.ok) location.reload();
}
</script>
</body>
</html>
