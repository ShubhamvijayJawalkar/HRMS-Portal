{% include "_base_start.html" %}
    <title>HRMS - Expense Management</title>
    <style>
        {% include "_shared_css.html" %}
        .navbar { background: var(--primary) !important; box-shadow: 0 2px 16px rgba(15,23,42,0.2); }
        .navbar-brand { font-weight: 800; color: white !important; letter-spacing: -0.3px; }
        .navbar-nav .nav-link { color: #94A3B8 !important; font-weight: 500; font-size: 13px; padding: 16px 14px !important; }
        .navbar-nav .nav-link:hover { color: white !important; background: rgba(255,255,255,0.06); }
        .navbar-nav .nav-link i { margin-right: 6px; }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--card-radius); box-shadow: var(--shadow-sm); margin-bottom: 20px; }
        .card-header { background: var(--primary); color: white; border-radius: var(--card-radius) var(--card-radius) 0 0 !important; padding: 12px 16px; font-weight: 700; font-size: 13px; border: none; }
        .card-header i { margin-right: 8px; color: #94A3B8; }
        .card-body { padding: 16px; }
        .page-title { font-size: 22px; font-weight: 800; color: var(--text); letter-spacing: -0.3px; margin-bottom: 20px; }
        .form-label { font-weight: 600; color: var(--text); font-size: 13px; margin-bottom: 6px; }
        .form-control, .form-select { border: 1.5px solid var(--border); border-radius: 10px; padding: 10px 14px; font-size: 14px; background: var(--background); }
        .form-control:focus, .form-select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(71,85,105,0.12); background: var(--surface); }
        .btn-primary { background: var(--primary); border: none; border-radius: var(--button-radius); font-weight: 700; padding: 10px 20px; font-size: 14px; }
        .btn-primary:hover { background: #334155; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(15,23,42,0.2); }
        .btn-success { background: var(--success); border: none; border-radius: var(--button-radius); font-weight: 600; }
        .btn-danger { background: var(--destructive); border: none; border-radius: var(--button-radius); font-weight: 600; }
        .btn-warning { background: var(--warning); border: none; border-radius: var(--button-radius); font-weight: 600; color: #334155; }
        .table th { color: var(--text); font-weight: 600; border: none; padding: 12px 14px; background: #F8FAFC; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
        .table td { vertical-align: middle; border-color: var(--border); padding: 10px 14px; font-size: 13px; }
        .table tbody tr:hover { background: #FAFBFC; }
        .logout-btn { color: #94A3B8; font-weight: 600; text-decoration: none; padding: 8px 16px; border-radius: 8px; }
        .logout-btn:hover { color: white; background: rgba(255,255,255,0.1); }
        .user-info { display: flex; align-items: center; gap: 12px; color: #CBD5E1; }
        .status-badge { padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 600; display: inline-block; }
        .status-Pending { background: #FEFCE8; color: #92400E; }
        .status-Approved { background: #F0FDF4; color: #166534; }
        .status-Rejected { background: #FEF2F2; color: #991B1B; }
        .btn-sm { border-radius: 8px; font-weight: 600; padding: 5px 14px; font-size: 12px; }
        .alert { border-radius: 10px; border: none; }
        .admin-badge { background: rgba(255,255,255,0.2); padding: 5px 12px; border-radius: 20px; font-size: 12px; color: white; font-weight: 600; }
        .status-Paid { background: #cff4fc; color: #055160; padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .amount { font-weight: bold; color: #198754; }
    </style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
</head>
<body>
{% include "_navbar.html" %}

<div class="container-fluid p-4">
    <h2 class="page-title">Expense Claims</h2>
    {% if is_manager %}
    <div class="mb-3">
        <button class="btn btn-outline-primary btn-sm" onclick="loadAdminExpenses()"><i class="bi bi-list me-1"></i>All Claims</button>
        <button class="btn btn-outline-warning btn-sm" onclick="loadPendingExpenseApprovals()"><i class="bi bi-inbox me-1"></i>Pending My Approval</button>
    </div>
    {% endif %}
    <div class="card">
        <div class="card-header"><h5 class="mb-0" id="expenseCardTitle">All Claims</h5></div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead><tr><th>Employee</th><th>Category</th><th>Amount</th><th>Description</th><th>Status</th><th>Date</th><th>Actions</th></tr></thead>
                    <tbody id="expensesTable"><tr><td colspan="7" class="text-center text-muted">Loading...</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script>
document.addEventListener('DOMContentLoaded', loadAdminExpenses);
async function loadAdminExpenses() {
    document.getElementById('expenseCardTitle').textContent = 'All Claims';
    const r = await fetch('/api/expenses');
    const data = await r.json();
    const tbody = document.getElementById('expensesTable');
    if (!data.length) { tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted">No claims</td></tr>'; return; }
    tbody.innerHTML = data.map(e => {
        const canAct = e.status === 'Pending';
        return `<tr>
            <td><strong>${e.employee}</strong><br><small>${e.emp_id}</small></td>
            <td>${e.category}</td><td class="amount">₹${e.amount.toFixed(2)}</td>
            <td>${e.description || '-'}</td>
            <td><span class="status-${e.status}">${e.status}</span></td>
            <td>${e.created_at ? new Date(e.created_at).toLocaleDateString() : '-'}</td>
            <td>${canAct ? `<button class="btn btn-success btn-sm me-1" onclick="updateStatus(${e.id},'Approved')">Approve</button><button class="btn btn-danger btn-sm" onclick="updateStatus(${e.id},'Rejected')">Reject</button>` : `<button class="btn btn-info btn-sm" onclick="updateStatus(${e.id},'Paid')">Mark Paid</button>`}</td>
        </tr>`;
    }).join('');
}
async function loadPendingExpenseApprovals() {
    document.getElementById('expenseCardTitle').textContent = 'Pending My Approval';
    const r = await fetch('/api/expenses?pending_my_approval=true');
    const data = await r.json();
    const tbody = document.getElementById('expensesTable');
    if (!data.length) { tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted">No pending approvals</td></tr>'; return; }
    tbody.innerHTML = data.map(e => {
        return `<tr>
            <td><strong>${e.employee}</strong><br><small>${e.emp_id}</small></td>
            <td>${e.category}</td><td class="amount">₹${e.amount.toFixed(2)}</td>
            <td>${e.description || '-'}</td>
            <td><span class="status-${e.status}">${e.status}</span></td>
            <td>${e.created_at ? new Date(e.created_at).toLocaleDateString() : '-'}</td>
            <td><button class="btn btn-success btn-sm me-1" onclick="updateStatus(${e.id},'Approved')">Approve</button><button class="btn btn-danger btn-sm" onclick="updateStatus(${e.id},'Rejected')">Reject</button></td>
        </tr>`;
    }).join('');
}
async function updateStatus(id, status) {
    const r = await fetch(`/api/expenses/${id}/status`, { method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({status}) });
    if (r.ok) { const title = document.getElementById('expenseCardTitle').textContent; if (title === 'Pending My Approval') loadPendingExpenseApprovals(); else loadAdminExpenses(); } else alert('Failed');
}
</script>
</body>
</html>
