<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HRMS - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        {% include "_shared_css.html" %}
        body { background: linear-gradient(135deg, #0F172A 0%, #334155 50%, #0F172A 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-container { width: 100%; max-width: 520px; }
        .brand { text-align: center; margin-bottom: 28px; }
        .brand-icon { width: 56px; height: 56px; background: rgba(255,255,255,0.12); border-radius: 16px; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; backdrop-filter: blur(8px); }
        .brand-icon i { font-size: 28px; color: #94A3B8; }
        .brand h1 { color: #FFFFFF; font-size: 26px; font-weight: 800; letter-spacing: -0.5px; margin: 0; }
        .brand p { color: #94A3B8; font-size: 14px; margin: 4px 0 0; }
        .card { background: rgba(255,255,255,0.98); border-radius: var(--card-radius); box-shadow: 0 10px 40px rgba(15,23,42,0.15); padding: 36px; border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(20px); }
        .card h2 { color: var(--text); font-weight: 800; font-size: 20px; text-align: center; margin-bottom: 4px; letter-spacing: -0.3px; }
        .card .subtitle { color: var(--text-muted); font-size: 14px; text-align: center; margin-bottom: 24px; }
        .form-label { font-weight: 600; color: var(--text); margin-bottom: 6px; font-size: 13px; }
        .form-control { border: 1.5px solid var(--border); border-radius: 10px; padding: 12px 14px; font-size: 14px; background: var(--background); }
        .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(71,85,105,0.12); background: var(--surface); }
        .form-control::placeholder { color: #94A3B8; font-size: 13px; }
        .input-group-text { background: var(--background); border: 1.5px solid var(--border); border-radius: 10px; color: var(--text-muted); }
        .btn-login { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: var(--button-radius); font-weight: 700; font-size: 15px; cursor: pointer; letter-spacing: 0.3px; }
        .btn-login:hover { background: #334155; transform: translateY(-1px); box-shadow: 0 4px 16px rgba(71,85,105,0.25); }
        .btn-login:active { transform: translateY(0); }
        .btn-login:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .forgot-link { color: var(--primary); font-size: 13px; font-weight: 500; text-decoration: none; }
        .forgot-link:hover { color: #334155; text-decoration: underline; }
        hr { margin: 24px 0; border-color: var(--border); opacity: 0.6; }
        .error-message { color: var(--destructive); font-size: 13px; margin-top: 10px; text-align: center; display: none; background: var(--destructive-light); padding: 8px 12px; border-radius: 8px; }
        .success-message { color: #065F46; font-size: 13px; margin-top: 10px; text-align: center; display: none; background: var(--success-light); padding: 8px 12px; border-radius: 8px; }
        .role-badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; }
        .role-badge.admin { background: var(--muted); color: var(--primary); }
        .role-badge.employee { background: var(--primary-light); color: var(--primary); }
        .pulse { animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.7; } }
    </style>
</head>
<body>
<div class="login-container">
    <div class="brand">
        <div class="brand-icon"><i class="bi bi-building"></i></div>
        <h1>HRMS Portal</h1>
        <p>Employee &amp; Break Management System</p>
    </div>
    <div class="card">
        <h2>Welcome Back</h2>
        <p class="subtitle">Sign in to your account</p>

        <form id="loginForm" autocomplete="off">
            <div class="mb-3">
                <label for="empId" class="form-label">Employee ID</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person-badge"></i></span>
                    <input type="text" id="empId" class="form-control" placeholder="e.g. EMP001" required autocomplete="off">
                </div>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" id="password" class="form-control" placeholder="Enter password" required autocomplete="off">
                </div>
            </div>
            <button type="submit" class="btn-login" id="loginBtn">
                <span id="loginBtnText">Sign In</span>
                <span id="loginBtnSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
            </button>
            <div class="text-center mt-3">
                <a href="#" onclick="showForgotPassword()" class="forgot-link"><i class="bi bi-shield-exclamation me-1"></i>Forgot Password?</a>
            </div>
            <div class="error-message" id="errorMsg"></div>
            <div class="success-message" id="successMsg"></div>
        </form>


    </div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const empId = document.getElementById('empId').value.trim().toUpperCase();
    const password = document.getElementById('password').value;
    const errorMsg = document.getElementById('errorMsg');
    const successMsg = document.getElementById('successMsg');
    const btn = document.getElementById('loginBtn');
    const btnText = document.getElementById('loginBtnText');
    const spinner = document.getElementById('loginBtnSpinner');
    errorMsg.style.display = 'none'; successMsg.style.display = 'none';
    if (!empId || !password) { errorMsg.textContent = 'Please fill in all fields'; errorMsg.style.display = 'block'; return; }
    btn.disabled = true; btnText.textContent = 'Signing in...'; spinner.classList.remove('d-none');
    try {
        const response = await fetch('/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ emp_id: empId, password: password }) });
        const data = await response.json();
        if (!response.ok) { errorMsg.textContent = data.error || 'Login failed'; errorMsg.style.display = 'block'; btn.disabled = false; btnText.textContent = 'Sign In'; spinner.classList.add('d-none'); return; }
        localStorage.setItem('userName', data.name || empId);
        successMsg.textContent = 'Login successful! Redirecting...';
        successMsg.style.display = 'block';
        setTimeout(() => { window.location.href = data.redirect; }, 800);
    } catch (error) { errorMsg.textContent = 'Connection error. Please try again.'; errorMsg.style.display = 'block'; btn.disabled = false; btnText.textContent = 'Sign In'; spinner.classList.add('d-none'); }
});

async function showForgotPassword() {
    const empId = prompt('Enter your Employee ID:');
    if (!empId) return;
    const email = prompt('Enter your registered email:');
    if (!email) return;
    try {
        const r = await fetch('/api/forgot-password', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ emp_id: empId, email: email }) });
        const data = await r.json();
        alert(data.message || 'If details match, an email has been sent.');
    } catch(e) { alert('Error processing request'); }
}

</script>

</body>
</html>
