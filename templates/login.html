<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HRMS - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0F172A;
            --primary-light: #1E293B;
            --secondary: #334155;
            --accent: #0369A1;
            --accent-light: #E0F2FE;
            --background: #F8FAFC;
            --surface: #FFFFFF;
            --text: #020617;
            --text-muted: #64748B;
            --muted: #E8ECF1;
            --border: #E2E8F0;
            --destructive: #DC2626;
            --success: #22C55E;
            --success-light: #F0FDF4;
            --warning: #EAB308;
            --warning-light: #FEFCE8;
            --info: #0369A1;
            --card-radius: 14px;
            --button-radius: 8px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
            --shadow: 0 2px 12px rgba(0,0,0,0.06);
            --shadow-lg: 0 10px 40px rgba(15,23,42,0.15);
            --transition-fast: 150ms ease;
            --transition-base: 250ms ease;
        }
        *, *::before, *::after { box-sizing: border-box; }
        a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }
        * { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
        body { background: linear-gradient(135deg, #0F172A 0%, #1E293B 50%, #0F172A 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-container { width: 100%; max-width: 520px; }
        .brand { text-align: center; margin-bottom: 28px; }
        .brand-icon { width: 56px; height: 56px; background: rgba(255,255,255,0.12); border-radius: 16px; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; backdrop-filter: blur(8px); }
        .brand-icon i { font-size: 28px; color: #60A5FA; }
        .brand h1 { color: #FFFFFF; font-size: 26px; font-weight: 800; letter-spacing: -0.5px; margin: 0; }
        .brand p { color: #94A3B8; font-size: 14px; margin: 4px 0 0; }
        .card { background: rgba(255,255,255,0.98); border-radius: var(--card-radius); box-shadow: var(--shadow-lg); padding: 36px; border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(20px); }
        .card h2 { color: var(--text); font-weight: 800; font-size: 20px; text-align: center; margin-bottom: 4px; letter-spacing: -0.3px; }
        .card .subtitle { color: var(--text-muted); font-size: 14px; text-align: center; margin-bottom: 24px; }
        .form-label { font-weight: 600; color: var(--text); margin-bottom: 6px; font-size: 13px; }
        .form-control { border: 1.5px solid var(--border); border-radius: 10px; padding: 12px 14px; font-size: 14px; background: var(--background); transition: all 0.2s; }
        .form-control:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(3,105,161,0.12); background: var(--surface); }
        .form-control::placeholder { color: #94A3B8; font-size: 13px; }
        .input-group-text { background: var(--background); border: 1.5px solid var(--border); border-radius: 10px; color: var(--text-muted); }
        .btn-login { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: var(--button-radius); font-weight: 700; font-size: 15px; cursor: pointer; transition: all 0.25s; letter-spacing: 0.3px; }
        .btn-login:hover { background: #1E293B; transform: translateY(-1px); box-shadow: 0 4px 16px rgba(15,23,42,0.25); }
        .btn-login:active { transform: translateY(0); }
        .btn-login:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .forgot-link { color: var(--accent); font-size: 13px; font-weight: 500; text-decoration: none; transition: color 0.2s; }
        .forgot-link:hover { color: #075985; text-decoration: underline; }
        hr { margin: 24px 0; border-color: var(--border); opacity: 0.6; }
        .error-message { color: var(--destructive); font-size: 13px; margin-top: 10px; text-align: center; display: none; background: #FEF2F2; padding: 8px 12px; border-radius: 8px; }
        .success-message { color: #166534; font-size: 13px; margin-top: 10px; text-align: center; display: none; background: #F0FDF4; padding: 8px 12px; border-radius: 8px; }
        .role-badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; }
        .role-badge.admin { background: #F1F5F9; color: var(--primary); }
        .role-badge.employee { background: #EFF6FF; color: var(--accent); }
        .pulse { animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.7; } }
        /* ── FR-AUTH-11 second factor ──────────────────────────────────────── */
        #mfaStep { display: none; }
        #mfaStep .code-input { letter-spacing: 8px; font-size: 20px; font-weight: 700; text-align: center; }
        #mfaSecret { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; word-break: break-all; background: var(--background); border: 1.5px dashed var(--border); border-radius: 10px; padding: 10px 12px; user-select: all; }
        #mfaQr { width: 190px; height: 190px; border: 1px solid var(--border); border-radius: 12px; padding: 8px; background: #fff; }
        .step-back { color: var(--text-muted); font-size: 13px; text-decoration: none; cursor: pointer; background: none; border: none; }
        .step-back:hover { color: var(--text); text-decoration: underline; }
    </style>
</head>
<body>
<div class="login-container">
    <div class="brand">
        <div class="brand-icon"><i class="bi bi-building"></i></div>
        <h1>HRMS Portal</h1>
        <p>Employee &amp; Break Management System</p>
    </div>
    <div class="card">
        <h2>Welcome Back</h2>
        <p class="subtitle">Sign in to your account</p>

        <form id="loginForm" autocomplete="off">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label for="empId" class="form-label">Employee ID</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person-badge"></i></span>
                    <input type="text" id="empId" class="form-control" placeholder="e.g. EMP001" required autocomplete="off">
                </div>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" id="password" class="form-control" placeholder="Enter password" required autocomplete="off">
                </div>
            </div>
            <button type="submit" class="btn-login" id="loginBtn">
                <span id="loginBtnText">Sign In</span>
                <span id="loginBtnSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
            </button>
            <div class="text-center mt-3">
                <a href="#" onclick="showForgotPassword()" class="forgot-link"><i class="bi bi-shield-exclamation me-1"></i>Forgot Password?</a>
            </div>
            <div class="error-message" id="errorMsg"></div>
            <div class="success-message" id="successMsg"></div>
        </form>

        <!-- FR-AUTH-11: the second step of sign-in. Shown in place of the password
             form once the server has accepted the password and asked for a
             factor. It is one panel because a first-time enrolment and a routine
             challenge are the same gesture — "type the six digits your
             authenticator shows" — differing only in whether a QR is shown first. -->
        <div id="mfaStep">
            <h2>Second Factor</h2>
            <p class="subtitle" id="mfaSubtitle">Enter the 6-digit code from your authenticator app</p>

            <div id="mfaEnrolBox" style="display:none" class="mb-3 text-center">
                <img id="mfaQr" alt="Authenticator QR code">
                <p class="text-muted mt-3 mb-2" style="font-size:13px">
                    Scan this with your authenticator app, or enter the key by hand:
                </p>
                <div id="mfaSecret"></div>
            </div>

            <form id="mfaForm" autocomplete="off">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                    <label for="mfaCode" class="form-label">Authenticator code</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-phone"></i></span>
                        <input type="text" id="mfaCode" class="form-control code-input"
                               placeholder="000000" maxlength="6" inputmode="numeric"
                               autocomplete="one-time-code" required>
                    </div>
                </div>
                <button type="submit" class="btn-login" id="mfaBtn">
                    <span id="mfaBtnText">Verify</span>
                    <span id="mfaBtnSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
                </button>
                <div class="text-center mt-3">
                    <button type="button" class="step-back" id="mfaBack">
                        <i class="bi bi-arrow-left me-1"></i>Back
                    </button>
                </div>
                <div class="error-message" id="mfaErrorMsg"></div>
            </form>
        </div>


    </div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const empId = document.getElementById('empId').value.trim().toUpperCase();
    const password = document.getElementById('password').value;
    const errorMsg = document.getElementById('errorMsg');
    const successMsg = document.getElementById('successMsg');
    const btn = document.getElementById('loginBtn');
    const btnText = document.getElementById('loginBtnText');
    const spinner = document.getElementById('loginBtnSpinner');
    errorMsg.style.display = 'none'; successMsg.style.display = 'none';
    if (!empId || !password) { errorMsg.textContent = 'Please fill in all fields'; errorMsg.style.display = 'block'; return; }
    btn.disabled = true; btnText.textContent = 'Signing in...'; spinner.classList.remove('d-none');
    try {
        const response = await fetch('/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ emp_id: empId, password: password }) });
        const data = await response.json();
        if (!response.ok) {
            // One message for every failure, because the server sends one: an unknown
            // account, a wrong password, a blocked account and a lockout are all the
            // same 401 (FR-AUTH-02), and saying which one it was here would undo the
            // control for the people using the browser.
            //
            // The locked-out user's own explanation arrives by **email and in-app
            // notification**, which is where the SRS puts it — FR-AUTH-03 pairs the
            // lock with a notification precisely because the login response must not
            // become a status oracle. That was worth being deliberate about: a
            // "your account is locked, try again in 14 minutes" banner is the obvious
            // thing to add here, and it is the exact enumeration channel the
            // requirement forbids.
            errorMsg.textContent = data.error === 'invalid_credentials'
                ? 'Invalid employee ID or password.'
                : (data.error || 'Login failed');
            errorMsg.style.display = 'block'; btn.disabled = false; btnText.textContent = 'Sign In'; spinner.classList.add('d-none'); return;
        }
        // FR-AUTH-11: a 200 here does not mean "signed in". For an account with a
        // second factor the response says which one it wants, and the session is
        // still parked — so branch on it before treating it as success.
        if (data.mfa_required) {
            btn.disabled = false; btnText.textContent = 'Sign In'; spinner.classList.add('d-none');
            localStorage.setItem('userName', empId);
            await beginMfa(data.mfa_required === 'enrol_required' ? 'enrol' : 'challenge');
            return;
        }
        localStorage.setItem('userName', data.name || empId);
        successMsg.textContent = 'Login successful! Redirecting...';
        successMsg.style.display = 'block';
        setTimeout(() => { window.location.href = data.redirect; }, 800);
    } catch (error) { errorMsg.textContent = 'Connection error. Please try again.'; errorMsg.style.display = 'block'; btn.disabled = false; btnText.textContent = 'Sign In'; spinner.classList.add('d-none'); }
});

// ── FR-AUTH-11: the second step ───────────────────────────────────────────
// Two server-chosen steps, and the endpoint that finishes each is named
// explicitly rather than derived from the step name: enrolment is confirmed
// with `POST /api/mfa/confirm`, while an existing factor is checked with
// `POST /api/mfa/challenge`. Building the URL as '/api/mfa/' + step pointed the
// enrolment submit back at `/api/mfa/enrol`, which *mints a new secret* — so the
// code the user had just read stopped matching and the page navigated on
// without ever verifying anything. Which endpoint answers is not a naming
// coincidence, so it is spelled out.
const MFA_STEPS = {
    enrol: { confirmUrl: '/api/mfa/confirm' },
    challenge: { confirmUrl: '/api/mfa/challenge' },
};
let mfaStep = null;

async function beginMfa(step) {
    mfaStep = step;
    document.getElementById('loginForm').style.display = 'none';
    document.getElementById('mfaStep').style.display = 'block';
    document.getElementById('mfaErrorMsg').style.display = 'none';
    const enrolBox = document.getElementById('mfaEnrolBox');
    if (step === 'enrol') {
        enrolBox.style.display = 'block';
        document.getElementById('mfaSubtitle').textContent =
            'Your role requires a second factor. Set it up now.';
        // The secret is written to the database *before* the code is confirmed, so
        // the QR can be re-fetched if this page is reloaded mid-enrolment.
        const r = await fetch('/api/mfa/enrol', { method: 'POST' });
        if (!r.ok) {
            const d = await r.json().catch(() => ({}));
            failMfa(d.error || 'Could not start enrolment.');
            return;
        }
        const d = await r.json();
        document.getElementById('mfaSecret').textContent = d.secret;
        document.getElementById('mfaQr').src = d.qr_url + '?t=' + Date.now();
        document.getElementById('mfaBtnText').textContent = 'Confirm and sign in';
    } else {
        enrolBox.style.display = 'none';
        document.getElementById('mfaSubtitle').textContent =
            'Enter the 6-digit code from your authenticator app';
        document.getElementById('mfaBtnText').textContent = 'Verify';
    }
    document.getElementById('mfaCode').focus();
}

function failMfa(message) {
    const el = document.getElementById('mfaErrorMsg');
    el.textContent = message;
    el.style.display = 'block';
    document.getElementById('mfaCode').value = '';
    document.getElementById('mfaCode').focus();
}

document.getElementById('mfaForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const code = document.getElementById('mfaCode').value.replace(/\D/g, '');
    const errorMsg = document.getElementById('mfaErrorMsg');
    const btn = document.getElementById('mfaBtn');
    const btnText = document.getElementById('mfaBtnText');
    const spinner = document.getElementById('mfaBtnSpinner');
    errorMsg.style.display = 'none';
    if (code.length !== 6) { failMfa('Enter the six digits shown in your app.'); return; }
    btn.disabled = true; btnText.textContent = 'Verifying...'; spinner.classList.remove('d-none');
    try {
        // One endpoint per step, named in `MFA_STEPS`: confirming a new factor
        // also completes this sign-in (the password already passed), while a
        // challenge verifies an existing one. Both answer with `redirect` on
        // success. The step must be one the server chose — a hand-crafted POST to
        // `/api/mfa/challenge` with no parked login is refused there, so an
        // unknown step here cannot reach a code check it should not.
        const step = MFA_STEPS[mfaStep];
        if (!step) { failMfa('Something went wrong. Sign in again.'); return; }
        const response = await fetch(step.confirmUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code: code }),
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
            // A locked-out challenge has thrown the parked login away, so there is
            // nothing to retry — say so rather than looping the user on a code
            // that can never be accepted.
            if (response.status === 429) {
                btn.disabled = true;
                errorMsg.textContent = data.error || 'Too many attempts. Sign in again.';
                errorMsg.style.display = 'block';
                setTimeout(() => { window.location.reload(); }, 2500);
                return;
            }
            failMfa(data.error || 'That code was not accepted.');
            return;
        }
        btnText.textContent = 'Signed in';
        setTimeout(() => { window.location.href = data.redirect || '/dashboard'; }, 400);
    } catch (error) {
        failMfa('Connection error. Please try again.');
    } finally {
        btn.disabled = false;
        spinner.classList.add('d-none');
        if (btnText.textContent === 'Verifying...') btnText.textContent = 'Verify';
    }
});

document.getElementById('mfaBack').addEventListener('click', () => {
    // Back means "start over": the parked password step is discarded by reloading,
    // which is the honest reset — there is no way to un-answer a correct code.
    window.location.reload();
});

async function showForgotPassword() {
    const empId = prompt('Enter your Employee ID:');
    if (!empId) return;
    const email = prompt('Enter your registered email:');
    if (!email) return;
    try {
        const r = await fetch('/api/forgot-password', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ emp_id: empId, email: email }) });
        const data = await r.json();
        alert(data.message || 'If details match, an email has been sent.');
    } catch(e) { alert('Error processing request'); }
}

</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
