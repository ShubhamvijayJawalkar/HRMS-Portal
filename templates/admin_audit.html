{% include "_base_start.html" %}
    <title>HRMS - Audit Log</title>
    <style>
        {% include "_shared_css.html" %}
        .navbar { background: var(--primary) !important; box-shadow: 0 2px 16px rgba(15,23,42,0.2); }
        .navbar-brand { font-weight: 800; color: white !important; letter-spacing: -0.3px; }
        .navbar-nav .nav-link { color: #94A3B8 !important; font-weight: 500; font-size: 13px; padding: 16px 14px !important; }
        .navbar-nav .nav-link:hover { color: white !important; background: rgba(255,255,255,0.06); }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--card-radius); box-shadow: var(--shadow-sm); margin-bottom: 20px; }
        .card-header { background: var(--primary); color: white; border-radius: var(--card-radius) var(--card-radius) 0 0 !important; padding: 12px 16px; font-weight: 700; font-size: 13px; border: none; }
        .card-header i { margin-right: 8px; color: #94A3B8; }
        .card-body { padding: 16px; }
        .page-title { font-size: 22px; font-weight: 800; color: var(--text); letter-spacing: -0.3px; margin-bottom: 20px; }
        .form-label { font-weight: 600; color: var(--text); font-size: 13px; margin-bottom: 6px; }
        .form-control, .form-select { border: 1.5px solid var(--border); border-radius: 10px; padding: 10px 14px; font-size: 14px; background: var(--background); }
        .form-control:focus, .form-select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(71,85,105,0.12); background: var(--surface); }
        .btn-primary { background: var(--primary); border: none; border-radius: var(--button-radius); font-weight: 700; padding: 10px 20px; font-size: 14px; }
        .btn-primary:hover { background: #334155; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(15,23,42,0.2); }
        .btn-outline-secondary { border-radius: var(--button-radius); font-weight: 600; padding: 10px 20px; font-size: 14px; }
        .table th { color: var(--text); font-weight: 600; border: none; padding: 12px 14px; background: #F8FAFC; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
        .table td { vertical-align: middle; border-color: var(--border); padding: 10px 14px; font-size: 13px; }
        .table tbody tr:hover { background: #FAFBFC; }
        .logout-btn { color: #94A3B8; font-weight: 600; text-decoration: none; padding: 8px 16px; border-radius: 8px; }
        .logout-btn:hover { color: white; background: rgba(255,255,255,0.1); }
        .user-info { display: flex; align-items: center; gap: 12px; color: #CBD5E1; }
        .btn-sm { border-radius: 8px; font-weight: 600; padding: 5px 14px; font-size: 12px; }
        .alert { border-radius: 10px; border: none; }
        .admin-badge { background: rgba(255,255,255,0.2); padding: 5px 12px; border-radius: 20px; font-size: 12px; color: white; font-weight: 600; }
        .action-badge { padding: 3px 10px; border-radius: 4px; font-size: 11px; font-weight: 600; font-family: monospace; }
        .action-LOGIN { background: #d1e7dd; color: #0f5132; }
        .action-LOGOUT { background: #e2e3e5; color: #41464b; }
        .action-USER_CREATE, .action-USER_UPDATE { background: #cff4fc; color: #055160; }
        .action-USER_BLOCK, .action-USER_UNBLOCK { background: #f8d7da; color: #842029; }
        .action-LEAVE_APPLY { background: #fff3cd; color: #664d03; }
        .action-LEAVE_APPROVE, .action-LEAVE_REJECT { background: #d1e7dd; color: #0f5132; }
        .action-PASSWORD_CHANGE, .action-PASSWORD_RESET { background: #e2e3e5; color: #41464b; }
        .action-PROFILE_UPDATE { background: #d1e7dd; color: #0f5132; }
        .filter-bar { display: flex; gap: 12px; align-items: end; flex-wrap: wrap; margin-bottom: 16px; }
        .filter-bar .form-label { font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 4px; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
</head>
<body>
{% include "_navbar.html" %}

<div class="container-fluid p-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="page-title">Audit Log</h2>
        <span id="logCount" class="text-muted"></span>
    </div>
    <div class="card">
        <div class="card-body">
            <div class="filter-bar">
                <div>
                    <label class="form-label">Module</label>
                    <select class="form-select" id="filterModule" style="width:160px" onchange="loadAudit(0)">
                        <option value="">All Modules</option>
                    </select>
                </div>
                <div>
                    <label class="form-label">Action</label>
                    <input type="text" class="form-control" id="filterAction" placeholder="e.g. APPROVE" style="width:180px">
                </div>
                <div>
                    <button class="btn btn-primary" onclick="loadAudit(0)" style="padding:8px 24px">Filter</button>
                    <button class="btn btn-outline-secondary" onclick="clearFilters()" style="padding:8px 16px;margin-left:6px">Clear</button>
                </div>
            </div>
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead><tr><th>Time</th><th>User</th><th>Action</th><th>Details</th><th>IP</th></tr></thead>
                    <tbody id="auditTable"><tr><td colspan="5" class="text-center text-muted">Loading...</td></tr></tbody>
                </table>
            </div>
            <div class="d-flex justify-content-between align-items-center mt-3">
                <button class="btn btn-outline-secondary btn-sm" onclick="prevPage()">&larr; Previous</button>
                <span id="pageInfo" class="text-muted">Page 1</span>
                <button class="btn btn-outline-secondary btn-sm" onclick="nextPage()">Next &rarr;</button>
            </div>
        </div>
    </div>
</div>
<script>
let page = 0;
const PAGE_SIZE = 50;

document.addEventListener('DOMContentLoaded', async () => {
    await loadModules();
    loadAudit(0);
});

async function loadModules() {
    try {
        const r = await fetch('/api/audit-modules');
        const modules = await r.json();
        const sel = document.getElementById('filterModule');
        modules.forEach(m => {
            const opt = document.createElement('option');
            opt.value = m; opt.textContent = m;
            sel.appendChild(opt);
        });
    } catch(e) { /* ignore */ }
}

function clearFilters() {
    document.getElementById('filterModule').value = '';
    document.getElementById('filterAction').value = '';
    loadAudit(0);
}

function getFilterParams(offset) {
    const module = document.getElementById('filterModule').value;
    const action = document.getElementById('filterAction').value.trim();
    let params = `limit=${PAGE_SIZE}&offset=${offset}`;
    if (module) params += `&module=${encodeURIComponent(module)}`;
    if (action) params += `&action=${encodeURIComponent(action)}`;
    return params;
}

async function loadAudit(offset) {
    page = offset;
    const r = await fetch(`/api/audit-log?${getFilterParams(offset)}`);
    const d = await r.json();
    document.getElementById('logCount').textContent = `Total: ${d.total} entries`;
    document.getElementById('pageInfo').textContent = `Page ${Math.floor(offset / PAGE_SIZE) + 1} of ${Math.ceil(d.total / PAGE_SIZE) || 1}`;
    const tbody = document.getElementById('auditTable');
    if (!d.data.length) { tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">No audit records</td></tr>'; return; }
    tbody.innerHTML = d.data.map(l => `
        <tr>
            <td style="white-space:nowrap">${l.created_at}</td>
            <td><strong>${l.emp_id || 'system'}</strong></td>
            <td><span class="action-badge action-${l.action}">${l.action}</span></td>
            <td>${l.details || '-'}</td>
            <td style="font-family:monospace;font-size:12px">${l.ip_address || '-'}</td>
        </tr>
    `).join('');
}

function nextPage() { loadAudit(page + PAGE_SIZE); }
function prevPage() { if (page >= PAGE_SIZE) loadAudit(page - PAGE_SIZE); }
</script>
</body>
</html>
