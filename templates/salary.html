{% include "_base_start.html" %}
    <title>HRMS - Salary Structures</title>
    <style>
        {% include "_shared_css.html" %}
        .navbar { background: var(--primary) !important; box-shadow: 0 2px 16px rgba(15,23,42,0.2); }
        .navbar-brand { font-weight: 800; color: white !important; letter-spacing: -0.3px; }
        .navbar-nav .nav-link { color: #94A3B8 !important; font-weight: 500; font-size: 13px; padding: 16px 14px !important; }
        .navbar-nav .nav-link:hover { color: white !important; background: rgba(255,255,255,0.06); }
        .navbar-nav .nav-link i { margin-right: 6px; }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--card-radius); box-shadow: var(--shadow-sm); margin-bottom: 20px; }
        .card-header { background: var(--primary); color: white; border-radius: var(--card-radius) var(--card-radius) 0 0 !important; padding: 12px 16px; font-weight: 700; font-size: 13px; border: none; }
        .card-header i { margin-right: 8px; color: #94A3B8; }
        .card-body { padding: 16px; }
        .page-title { font-size: 22px; font-weight: 800; color: var(--text); letter-spacing: -0.3px; margin-bottom: 20px; }
        .form-label { font-weight: 600; color: var(--text); font-size: 13px; margin-bottom: 6px; }
        .form-control, .form-select { border: 1.5px solid var(--border); border-radius: 10px; padding: 10px 14px; font-size: 14px; background: var(--background); }
        .form-control:focus, .form-select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(71,85,105,0.12); background: var(--surface); }
        .btn-primary { background: var(--primary); border: none; border-radius: var(--button-radius); font-weight: 700; padding: 10px 20px; font-size: 14px; }
        .btn-primary:hover { background: #334155; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(15,23,42,0.2); }
        .btn-success { background: var(--success); border: none; border-radius: var(--button-radius); font-weight: 600; }
        .btn-danger { background: var(--destructive); border: none; border-radius: var(--button-radius); font-weight: 600; }
        .btn-warning { background: var(--warning); border: none; border-radius: var(--button-radius); font-weight: 600; color: #334155; }
        .table th { color: var(--text); font-weight: 600; border: none; padding: 12px 14px; background: #F8FAFC; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
        .table td { vertical-align: middle; border-color: var(--border); padding: 10px 14px; font-size: 13px; }
        .table tbody tr:hover { background: #FAFBFC; }
        .logout-btn { color: #94A3B8; font-weight: 600; text-decoration: none; padding: 8px 16px; border-radius: 8px; }
        .logout-btn:hover { color: white; background: rgba(255,255,255,0.1); }
        .user-info { display: flex; align-items: center; gap: 12px; color: #CBD5E1; }
        .status-badge { padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 600; display: inline-block; }
        .status-Pending { background: #FEFCE8; color: #92400E; }
        .status-Approved { background: #F0FDF4; color: #166534; }
        .status-Rejected { background: #FEF2F2; color: #991B1B; }
        .btn-sm { border-radius: 8px; font-weight: 600; padding: 5px 14px; font-size: 12px; }
        .alert { border-radius: 10px; border: none; }
        .admin-badge { background: rgba(255,255,255,0.2); padding: 5px 12px; border-radius: 20px; font-size: 12px; color: white; font-weight: 600; }
        .net-amount { font-weight: bold; color: #22C55E; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
</head>
<body>
{% include "_navbar.html" %}

<div class="container-fluid p-4">
    <h2 class="page-title">Salary Structures</h2>
    <div class="card">
        <div class="card-header"><h5 class="mb-0">New / Edit Structure</h5></div>
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-3"><label class="form-label">Employee</label><select id="empSelect" class="form-select"></select></div>
                <div class="col-md-2"><label class="form-label">Basic</label><input id="basic" class="form-control" type="number" step="0.01"></div>
                <div class="col-md-2"><label class="form-label">HRA</label><input id="hra" class="form-control" type="number" step="0.01" value="0"></div>
                <div class="col-md-2"><label class="form-label">Allowances</label><input id="allowances" class="form-control" type="number" step="0.01" value="0"></div>
                <div class="col-md-2"><label class="form-label">Deductions</label><input id="deductions" class="form-control" type="number" step="0.01" value="0"></div>
                <div class="col-md-1"><label class="form-label">&nbsp;</label><button class="btn btn-primary w-100" onclick="saveSalary()">Save</button></div>
                <div class="col-md-1"><label class="form-label">&nbsp;</label><button class="btn btn-outline-primary w-100" onclick="previewPayslip()">Preview</button></div>
            </div>
            <div id="previewBox" class="mt-3 p-3" style="background:#F8FAFC;border:1px solid var(--border);border-radius:10px;display:none;">
                <h6 style="font-weight:700;margin-bottom:12px;"><i class="bi bi-receipt me-2"></i>Payslip Preview</h6>
                <div class="row g-2" id="previewContent"></div>
            </div>
        </div>
    </div>
    <div class="card">
        <div class="card-header"><h5 class="mb-0">All Structures</h5></div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead><tr><th>Employee</th><th>Basic</th><th>HRA</th><th>Allowances</th><th>Deductions</th><th>Gross</th><th>Effective From</th></tr></thead>
                    <tbody id="salaryTable"><tr><td colspan="7" class="text-center text-muted">Loading...</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script>
document.addEventListener('DOMContentLoaded', async () => {
    const r = await fetch('/api/users');
    const users = await r.json();
    const sel = document.getElementById('empSelect');
    users.forEach(u => { const o = document.createElement('option'); o.value = u.emp_id; o.textContent = `${u.name} (${u.emp_id})`; sel.appendChild(o); });
    loadSalaries();
});
async function loadSalaries() {
    const r = await fetch('/api/salary-structures');
    const data = await r.json();
    const tbody = document.getElementById('salaryTable');
    if (!data.length) { tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted">No structures</td></tr>'; return; }
    tbody.innerHTML = data.map(s => `<tr>
        <td><strong>${s.employee}</strong><br><small class="text-muted">${s.emp_id}</small></td>
        <td>${s.basic.toFixed(2)}</td><td>${s.hra.toFixed(2)}</td>
        <td>${s.allowances.toFixed(2)}</td><td>${s.deductions.toFixed(2)}</td>
        <td class="net-amount">${(s.basic + s.hra + s.allowances).toFixed(2)}</td>
        <td>${s.effective_from || '-'}</td>
    </tr>`).join('');
}
async function previewPayslip() {
    const body = {
        basic: parseFloat(document.getElementById('basic').value) || 0,
        hra: parseFloat(document.getElementById('hra').value) || 0,
        allowances: parseFloat(document.getElementById('allowances').value) || 0,
        deductions: parseFloat(document.getElementById('deductions').value) || 0
    };
    if (!body.basic) return alert('Enter basic salary first');
    const r = await fetch('/api/salary-structures/preview', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
    const d = await r.json();
    if (!r.ok) return alert(d.error);
    const box = document.getElementById('previewBox');
    const content = document.getElementById('previewContent');
    box.style.display = 'block';
    const items = [
        ['Basic', d.basic], ['HRA', d.hra], ['Allowances', d.allowances],
        ['Gross', d.gross, true], ['PF', '-'+d.pf], ['ESI', '-'+d.esi],
        ['Professional Tax', '-'+d.pt], ['Other Deductions', '-'+d.other_deductions],
        ['Total Deductions', '-'+d.total_deductions, true],
        ['Net Salary', d.net, true, '#22C55E'],
        ['Annual Gross', d.annual_gross], ['Est. Annual TDS', d.annual_tds],
        ['Est. Monthly TDS', d.monthly_tds],
    ];
    content.innerHTML = items.map(([label, val, bold, color]) =>
        `<div class="col-4"><span style="font-size:11px;color:var(--text-muted);">${label}</span><div style="font-weight:${bold?'800':'600'};font-size:14px;${color?'color:'+color:''};">₹${val.toFixed(2)}</div></div>`
    ).join('');
}
async function saveSalary() {
    const body = {
        emp_id: document.getElementById('empSelect').value,
        basic: parseFloat(document.getElementById('basic').value) || 0,
        hra: parseFloat(document.getElementById('hra').value) || 0,
        allowances: parseFloat(document.getElementById('allowances').value) || 0,
        deductions: parseFloat(document.getElementById('deductions').value) || 0
    };
    if (!body.emp_id) return alert('Select employee');
    if (!body.basic) return alert('Basic salary required');
    const r = await fetch('/api/salary-structures', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
    const res = await r.json();
    if (r.ok) { loadSalaries(); document.querySelectorAll('#basic,#hra,#allowances,#deductions').forEach(e => e.value = ''); document.getElementById('previewBox').style.display = 'none'; } else alert(res.error);
}
</script>
</body>
</html>
