name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# One job, one backend. This used to be two parallel jobs, `duckdb` and
# `postgres`, because the app could run on either. DuckDB was removed at the
# Phase-6 decommission, so the `duckdb` job is gone and its steps — lint, compose
# validation, the image build — moved here rather than being dropped. What that
# job uniquely provided was the fast signal; what this one uniquely provided was
# the only backend, so it is now the whole gate.
jobs:
  test:
    name: test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hrms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hrms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      SECRET_KEY: ci-secret-key
      FLASK_DEBUG: 0
      APP_DB_SCHEMA: legacy
      # Disposable validation database: the demo seed is what the suites expect.
      HRMS_ALLOW_DEMO_SEED: "1"
      # FR-AUTH-11: encrypts authenticator secrets at rest. MFA returns 503
      # without it rather than storing them in the clear, so it is a fixed
      # non-production value here and never a real secret in a log.
      MFA_ENCRYPTION_KEY: "3CkZThJOKnNbJkL2ksuJN8gsQ7cJi5FAFPt3g50KmsE="
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/hrms

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check . --ignore E501

      # Type checking and the production bundle. Run before the Python suites
      # because a TypeScript error or a broken build should fail in seconds,
      # not after the browser suite has spent three minutes on a version of the
      # app that could never have shipped.
      #
      # `npm ci` rather than `npm install` so the lockfile is authoritative --
      # an unlocked dependency graph means the build can pass locally and fail in
      # CI on a transitive bump.
      - name: Build the React UI
        run: |
          npm ci --prefix frontend --no-audit --no-fund
          # npm >= 11 blocks postinstall scripts unless approved. esbuild's
          # postinstall places the platform binary Vite needs; without it the
          # build fails with a message about installing a platform binary,
          # which does not point at the real cause.
          npm install-scripts approve esbuild --prefix frontend || true
          npm run build --prefix frontend

      # The bundle must exist before the Python suites run: several React tests
      # assert on real served assets rather than skipping quietly, and the
      # Docker build below copies this same output.
      - name: Verify the React bundle
        run: test -f static/app/index.html && ls static/app/assets

      - name: Validate cutover tooling
        run: |
          python -m py_compile scripts/cutover_preflight.py scripts/check_cc_rules.py scripts/probe_public_flip.py
          SECRET_KEY=ci-compose-secret POSTGRES_PASSWORD=ci-compose-password \
            docker compose config >/dev/null

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h localhost -U postgres -d hrms; then exit 0; fi
            sleep 1
          done
          echo "PostgreSQL did not become ready" >&2
          exit 1

      # The unit suite asserts against the v2.0 target as well as the
      # compatibility schema (identity keys, BOOLEAN columns, the canonical data
      # types), so `public` has to exist in this database before it runs. This
      # mirrors the real deployment: `public` = v2.0 target, `legacy` = the
      # v1.0 shape the app code still speaks.
      - name: Create the v2.0 public schema
        run: python -m alembic -c migrations/alembic.ini upgrade head

      # Phase 0 of docs/REACT_UI_MIGRATION.md: the inventory is generated from
      # app.py, the templates and policy.py, and a generated document that has
      # gone stale is worse than none -- it is what the migration order is
      # planned from. The suite asserts the generator reports no drift.
      - name: Check the UI inventory is in step with the code
        run: python scripts/ui_inventory.py --markdown docs/UI_INVENTORY.md

      - name: Run unit tests on the compatibility schema
        run: python -m pytest tests/test_app.py -v

      # Server-side Redis sessions are the production path. This used to be the
      # whole suite re-run with REDIS_URL set, which asserted nothing about the
      # session store: no test referred to it, so the step passed identically
      # whether or not the backend was Redis. That was not hypothetical - the
      # first run of the new file found the app silently on cookie sessions
      # because Redis was down, and the old step would still have been green.
      # The backend is chosen when `app` is imported, so it needs its own
      # pytest process.
      - name: Assert the server-side Redis session store
        run: python -m pytest tests/test_redis_sessions.py -v
        env:
          REDIS_URL: redis://localhost:6379/0

      - name: Install Playwright browsers
        run: python -m playwright install chromium

      - name: Run browser tests
        run: python -m pytest tests/test_playwright.py -v

      # A clean v2.0 database created by Alembic, then the three cutover gates:
      # the read-only preflight, the CC-01 rule checker and the public-flip
      # probe (every authenticated GET route + the core write flows). All three
      # exit non-zero on failure, so a step turns red on its own.
      - name: Create the v2.0 target and run the cutover gates
        run: |
          # psycopg rather than the psql client: the service container
          # authenticates with scram, so a client would need the password in the
          # environment, and the driver is already a dependency of the app.
          python - <<'PY'
          import psycopg
          dsn = "postgresql://postgres:postgres@localhost:5432/postgres"
          with psycopg.connect(dsn, autocommit=True) as conn:
              conn.execute("DROP DATABASE IF EXISTS hrms_probe")
              conn.execute("CREATE DATABASE hrms_probe")
          PY
          export PROBE_URL=postgresql+psycopg://postgres:postgres@localhost:5432/hrms_probe
          DATABASE_URL=$PROBE_URL python -m alembic -c migrations/alembic.ini upgrade head
          echo "--- read-only preflight ---"
          DATABASE_URL=$PROBE_URL python scripts/cutover_preflight.py --schema public
          echo "--- CC-01 rule checker ---"
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/hrms_probe \
            python scripts/check_cc_rules.py
          echo "--- public-flip probe ---"
          # The probe signs in as an Admin, and MFA is compulsory for that role,
          # so it walks the second factor rather than bypassing it. It needs the
          # encryption key to do so — MFA refuses with 503 without it, by design.
          DATABASE_URL=$PROBE_URL APP_DB_SCHEMA=public \
            MFA_ENCRYPTION_KEY="3CkZThJOKnNbJkL2ksuJN8gsQ7cJi5FAFPt3g50KmsE=" \
            python scripts/probe_public_flip.py

      # The image build is the real test of the multi-stage Dockerfile: the SPA is
      # built in a Node stage and copied into the Python image, and a
      # .dockerignore mistake would drop it while every earlier step still
      # passed — they all build on the host, not inside the image.
      #
      # This inspects the image's contents rather than booting it. Booting
      # would need a reachable PostgreSQL, which turns a "did the bundle get
      # copied in" check into a database-fixture dependency and fails for a
      # reason unrelated to the thing being verified.
      - name: Build Docker image
        run: docker build -t hrms .

      - name: Verify the image contains the built React shell
        run: |
          docker run --rm --entrypoint sh hrms -c '
            set -e
            test -f /app/static/app/index.html || {
              echo "index.html missing from the image"; exit 1; }
            # The shell must reference a fingerprinted asset, and that asset
            # must actually be in the image. An index.html whose script tag
            # points at a file the image does not contain is the failure mode
            # a missing COPY produces, and it renders as a blank page.
            asset=$(sed -n "s/.*src=\"\(\/app\/assets\/[^\"]*\.js\)\".*/\1/p" \
              /app/static/app/index.html | head -1)
            [ -n "$asset" ] || { echo "shell references no built asset"; exit 1; }
            file="/app/static${asset}"
            test -f "$file" || { echo "referenced asset $file is not in the image"; exit 1; }
            echo "shell asset present: $file"
            # node_modules must not have leaked into the runtime image.
            test ! -d /app/frontend/node_modules || {
              echo "node_modules leaked into the runtime image"; exit 1; }
            echo "image contents OK"
          '
